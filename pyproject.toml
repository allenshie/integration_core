[project]
name = "integration"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.11.0.86,<4.12.0",
    "numpy==1.26",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "python-dotenv>=0.21.0",
    "loguru>=0.7.3",
    "paho-mqtt>=1.6.1",
    "smart-workflow @ git+https://github.com/allenshie/smart-workflow.git@39134386064e85be54ed47e1cf2b767cb6cdf7ac",
    "MCMOT",
    "smart-messaging-core==0.1.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4.2",
]

[dependency-groups]
dev = [
    "ruff==0.9.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
per-file-ignores = { "tests/test_logging.py" = ["E402"] }

[tool.uv.sources]
MCMOT = { git = "ssh://git@github.com/ChenPingChen/MCMOT.git", rev = "9b0a04be1e79e02b382d7dbcb71c6b70bd9edfa5" }
